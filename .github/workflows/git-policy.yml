# Git 政策——契约见 book/guidelines/git-workflow.md（Clean Commit + Clean Flow）。
# 三件事：main 只收来自 dev 的 PR 且不许直推；进 dev/main 的提交主题过 Clean Commit
# 校验；同一个触发面跑 book:release-check。历史提交不校验（规则只管新提交）。
name: git-policy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-direction:
    runs-on: ubuntu-latest
    steps:
      - name: main 只收同仓库 dev 的 PR merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ "$BASE_REF" == 'main' && ("$HEAD_REF" != 'dev' || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY") ]]; then
              echo '::error::main only accepts pull requests from dev in this repository.'
              exit 1
            fi
          elif [[ "$GITHUB_REF" == 'refs/heads/main' && "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
            parents=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PUSH_SHA" --jq '.parents | length')
            prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PUSH_SHA/pulls?per_page=100")
            count=$(printf '%s' "$prs" | jq --arg sha "$PUSH_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "dev" and .head.repo.full_name == $repo and .merge_commit_sha == $sha)] | length')
            if [[ "$parents" != '2' || "$count" == '0' ]]; then
              echo '::error::main updates must be merge commits from a merged dev pull request.'
              exit 1
            fi
          fi

  commit-subjects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验提交主题
        # `${{ }}` 只出现在 env 块、以数据身份进 shell——分支名再怪也只是字符串（防注入）
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/$PR_BASE_REF..$PR_HEAD_SHA"
          else
            before="$PUSH_BEFORE"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "新分支首次推送——既有历史不重写、不校验，跳过"
              exit 0
            fi
            if ! git rev-parse -q --verify "$before" >/dev/null; then
              echo "无法定位推送前提交（疑似强推）——跳过主题校验"
              exit 0
            fi
            range="$before..$PUSH_SHA"
          fi
          status=0
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            node scripts/check-commit-message.mjs "$s" || status=1
          # 首次迁入的本地历史截至此提交；保留原 ID，只校验基线之后的新提交。
          done < <(git log --no-merges --format=%s "$range" --not 3d6f32b8bbc4c6572173f0d01abdaec75237f74b)
          exit $status

  book-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # book:release-check 零依赖，node + git 即可，无需装依赖
      - run: npm run book:release-check
