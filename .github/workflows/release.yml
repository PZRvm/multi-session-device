name: release-installers

on:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Match release branch to package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "release/v$version" ]]; then
            echo '::error::Select the release/v<package version> branch.'
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run book:release-check
      - name: Test on macOS
        if: matrix.platform == 'mac-arm64'
        run: npm test
      - run: npm run build
      - name: Package macOS ARM64 DMG
        if: matrix.platform == 'mac-arm64'
        run: |
          npx electron-builder --mac dmg --arm64 --publish never \
            '--config.dmg.artifactName=${name}-${version}-mac-${arch}.${ext}'
          node scripts/verify-packaged-asar.mjs
      - name: Package Windows x64 NSIS installer
        if: matrix.platform == 'windows-x64'
        run: |
          npx electron-builder --win nsis --x64 --publish never \
            '--config.nsis.artifactName=${name}-${version}-windows-${arch}-setup.${ext}'
          node scripts/verify-packaged-asar.mjs dist/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified installers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Verify files and calculate SHA-256
        working-directory: installers
        run: |
          version=$(node -p "require('../package.json').version")
          test -s "multi-session-device-$version-mac-arm64.dmg"
          test -s "multi-session-device-$version-windows-x64-setup.exe"
          sha256sum ./*.dmg ./*.exe > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create preview release from the exact build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" \
            installers/*.dmg installers/*.exe installers/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag Preview" \
            --prerelease \
            --notes-file .github/release-notes.md
