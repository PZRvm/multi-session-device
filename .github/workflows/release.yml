name: release-installers

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-installers-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Check merged PR and release version
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate package version
        id: version
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) ||
              lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('package.json and package-lock.json must have the same valid release version')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          NODE
      - name: Skip an already published version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          error_file="$RUNNER_TEMP/release-version-error.txt"
          if draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.draft' 2>"$error_file"); then
            if [[ "$draft" != 'false' ]]; then
              echo '::error::This version has an unfinished draft release. Resolve it before retrying.'
              exit 1
            fi
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "### $RELEASE_TAG already exists; installers and release are skipped without overwriting it." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'HTTP 404' "$error_file"; then
            if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha' 2>"$error_file"); then
              if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
                echo '::error::This tag already points to another commit. Update the version in dev.'
                exit 1
              fi
            elif ! grep -q 'HTTP 404' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run book:release-check
      - name: Test on macOS
        if: matrix.platform == 'mac-arm64'
        run: npm test
      - run: npm run build
      - name: Package macOS ARM64 DMG
        if: matrix.platform == 'mac-arm64'
        run: |
          npx electron-builder --mac dmg --arm64 --publish never \
            '--config.dmg.artifactName=${name}-${version}-mac-${arch}.${ext}'
          node scripts/verify-packaged-asar.mjs
      - name: Package Windows x64 NSIS installer
        if: matrix.platform == 'windows-x64'
        run: |
          npx electron-builder --win nsis --x64 --publish never \
            '--config.nsis.artifactName=${name}-${version}-windows-${arch}-setup.${ext}'
          node scripts/verify-packaged-asar.mjs dist/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified installers
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Verify files and calculate SHA-256
        working-directory: installers
        run: |
          version=$(node -p "require('../package.json').version")
          test -s "multi-session-device-$version-mac-arm64.dmg"
          test -s "multi-session-device-$version-windows-x64-setup.exe"
          sha256sum ./*.dmg ./*.exe > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create preview release from the exact build commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const template = fs.readFileSync('.github/release-notes.md', 'utf8')
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'),
            template.replaceAll('{{VERSION}}', process.env.RELEASE_VERSION))
          NODE
          tag="v$RELEASE_VERSION"
          gh release create "$tag" \
            installers/*.dmg installers/*.exe installers/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$tag Preview" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
